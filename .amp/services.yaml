services:
  # The development preview of v2 (scripts/v2-dev/preview.mjs): a private PostgreSQL, nats-server, an S3 server, the stand-in model and one Pim process that runs every
  # role, with the dev sign-in route turned on (PIM_DEV_SIGN_IN=1). State persists in .wrangler/state-v2-dev; the web app is rebuilt when web/src changes.
  preview:
    command: node scripts/v2-dev/preview.mjs
    port: 8787
    health: /health
    portal:
      url: /__dev/sign-in/ada?returnTo=/
      title: Pim preview
      description: Signs you in as @ada, the preview's admin. Chats answer with a stand-in model; send `/tool <name> {json}` to make it call a tool.
