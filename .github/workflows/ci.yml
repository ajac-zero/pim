name: CI

on:
  pull_request:
  push:
    branches: [main, "pim/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every job runs on every change, side by side, and each is sized to finish in about a minute and a half with its setup, so CI as a whole
# answers in under two. The Compose smoke test runs after a push to main, in compose.yml.
jobs:
  # Biome over web/, and the check that the repository names no deployment's internal hosts or identifiers.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-internal-identifiers.mjs
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pim-web test

  # The standalone daemons (displayd, sandbox-manager and its hostopsd, workspace-agentd, the web host): `node --test`.
  daemons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:daemons

  # The root's Node project: the computer's tests, which start real processes (computer/test, the supervisor of apps), and the repository's own scripts (scripts/*.test.ts), four files at a time on this runner.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --maxWorkers=4

  # Pim's desktop driver on a real display: displayd starts Xvnc, openbox, the accessibility bus and the driver, as in the computer image (deploy/Dockerfile.computer),
  # and the test drives a GTK app with it. The node job skips the file, which has no display there.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tigervnc-standalone-server openbox dbus at-spi2-core xauth xdotool wmctrl python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run computer/test/desktop-driver.test.ts
        env:
          PIM_REQUIRE_DESKTOP: "1"

  # Every package's own tests but @pim/v2-server's, all packages at once rather than in dependency order (their tests don't depend on each other's).
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The v2 packages' tests run against a real PostgreSQL and NATS; a missing binary fails them rather than skipping them.
      - run: packages/v2-runtime/scripts/ensure-postgres.sh
      - run: packages/v2-server/scripts/ensure-nats.sh
      # `pnpm test:packages:rest`, with every package started at once rather than four at a time, which this runner holds.
      - run: pnpm --filter "./packages/*" --filter "!@pim/v2-server" --no-sort --workspace-concurrency=16 test
        env:
          PIM_V2_REQUIRE_INFRA: "1"
          PIM_NATS_BIN: /usr/local/bin/nats-server

  # The integration tests of @pim/v2-server, the longest package, four files at a time, each in a database copied from a template.
  v2-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: packages/v2-runtime/scripts/ensure-postgres.sh
      - run: packages/v2-server/scripts/ensure-nats.sh
      - run: pnpm test:packages:v2-server
        env:
          PIM_V2_REQUIRE_INFRA: "1"
          PIM_NATS_BIN: /usr/local/bin/nats-server
          PIM_V2_TEST_WORKERS: "4"
