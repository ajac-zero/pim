# Gives Caddy PIM_INGRESS_SECRET, which the Caddyfile sends to Pim with every request. Install as
# /etc/systemd/system/caddy.service.d/pim-ingress.conf, then `systemctl daemon-reload` and
# `systemctl restart caddy`. systemd reads the file as root before Caddy starts as its own user,
# so /etc/pim/ingress.env can stay root's, mode 400.
[Service]
EnvironmentFile=/etc/pim/ingress.env
