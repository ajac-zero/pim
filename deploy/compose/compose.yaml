# Pim, portable: one Docker Compose stack with no Kubernetes, no Temporal and nothing from Cloudflare or AWS.
#
#   cp env.example .env     # then replace every CHANGE_ME
#   docker compose up -d                        # core: caddy, postgres, pgbouncer, nats, seaweedfs, migrator, gate, live, runner, forge, maintenance, and web (the interface, its own image)
#   docker compose up -d --scale runner=3       # more Runners; partitions are leased between them
#   docker compose --profile canvas up -d       # shared-notes canvas server (/api/notes/live)
#   docker compose --profile computer up -d     # personal-computer relay and TURN (relay, coturn)
#   docker compose --profile local-computer up -d  # pim-computer on this machine, paired like any other computer (docs/v2-operations.md "A computer on the same machine")
#   docker compose --profile coding up -d       # sandbox manager, egress proxy and workspace image for coding
#   docker compose --profile observability up -d  # Prometheus (with the alert rules) and Grafana (with the Pim dashboard) on 127.0.0.1:3000
#
# The core stack runs with every optional profile off: chat, agents, memory, apps and sharing work without a computer or a coding backend.
# The Pim image is one image that runs one role per container, chosen by PIM_ROLE (migrator, gate, live, runner, forge, maintenance, canvas, relay).
# Every role serves GET /healthz on PIM_HTTP_PORT and exits non-zero when it cannot start; see docs/v2-operations.md for the role contract.

name: pim

x-pim: &pim
  image: ${PIM_IMAGE:?set PIM_IMAGE in .env}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [internal]
  env_file: [.env]
  environment: &pim-env
    PIM_PUBLIC_URL: ${PIM_PUBLIC_URL:?set PIM_PUBLIC_URL in .env}
    PIM_CONTENT_ORIGIN: ${PIM_CONTENT_ORIGIN:-}
    PIM_APPS_ORIGIN: ${PIM_APPS_ORIGIN:-}
    # Each role connects as its own login (a member of @pim/v2-contracts' pim_gate, pim_runtime, pim_live, pim_forge or pim_maintenance role), set per service below.
    # Application traffic goes through PgBouncer in transaction mode; only the migrator and maintenance connect to PostgreSQL directly.
    PIM_NATS_URL: nats://nats:4222
    # loadProcessConfig (@pim/v2-contracts) reads the first three; the credentials are read by the object store adapter.
    PIM_S3_ENDPOINT: http://seaweedfs:8333
    PIM_S3_BUCKET: ${PIM_S3_BUCKET:-pim-objects}
    PIM_S3_REGION: us-east-1
    PIM_S3_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:?}
    PIM_S3_SECRET_KEY: ${SEAWEED_SECRET_KEY:?}
    # Envelope-encryption key ring: PIM_KEK_<id> is a base64 32-byte key, PIM_KEK_CURRENT names the one that wraps new keys.
    PIM_KEK_CURRENT: ${PIM_KEK_CURRENT:-k1}
    PIM_KEK_k1: ${PIM_KEK_K1:?}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-false}
    PIM_METRICS_PORT: "9464"
    # The proxy sets the client address and this secret on every request; roles answer only requests that carry it.
    PIM_INGRESS_SECRET: ${PIM_INGRESS_SECRET:?}
  depends_on: &pim-deps
    migrator: { condition: service_completed_successfully }
    pgbouncer: { condition: service_healthy }
    nats: { condition: service_healthy }
    objects-init: { condition: service_completed_successfully }

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PIM_DOMAIN: ${PIM_DOMAIN:?set PIM_DOMAIN in .env}
      PIM_CONTENT_DOMAIN: ${PIM_CONTENT_DOMAIN:-content.invalid}
      PIM_APPS_DOMAIN: ${PIM_APPS_DOMAIN:-apps.invalid}
      PIM_APPS_SITE: ${PIM_APPS_SITE:-*.${PIM_APPS_DOMAIN:-apps.invalid}}
      PIM_ACME_EMAIL: ${PIM_ACME_EMAIL:-}
      PIM_INGRESS_SECRET: ${PIM_INGRESS_SECRET:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # `front.pim.internal` is the name a coding workspace's egress proxy reaches the front door by (PIM_CODING_BROKER_URL), dotted because the sandbox manager only takes dotted hostnames.
    networks: { internal: { aliases: [front.pim.internal] }, edge: {} }
    depends_on:
      gate: { condition: service_healthy }
      live: { condition: service_healthy }
      web: { condition: service_healthy }

  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    # Durability is never relaxed here: fsync, full_page_writes and synchronous_commit stay on (see postgres/postgresql.conf).
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: pim
      PIM_MIGRATOR_DB_PASSWORD: ${PIM_MIGRATOR_DB_PASSWORD:?}
      PIM_GATE_DB_PASSWORD: ${PIM_GATE_DB_PASSWORD:?}
      PIM_RUNTIME_DB_PASSWORD: ${PIM_RUNTIME_DB_PASSWORD:?}
      PIM_LIVE_DB_PASSWORD: ${PIM_LIVE_DB_PASSWORD:?}
      PIM_FORGE_DB_PASSWORD: ${PIM_FORGE_DB_PASSWORD:?}
      PIM_MAINTENANCE_DB_PASSWORD: ${PIM_MAINTENANCE_DB_PASSWORD:?}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256mb
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pim"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "printf '\"pgbouncer_auth\" \"%s\"\\n' \"$$PGBOUNCER_AUTH_PASSWORD\" > /tmp/userlist.txt && exec pgbouncer /etc/pgbouncer/pgbouncer.ini"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    environment:
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10.22-alpine
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    volumes: ["./nats/nats.conf:/etc/nats/nats.conf:ro"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json.template:/etc/seaweedfs/s3.json.template:ro
    entrypoint: ["/bin/sh", "-c", "sed -e \"s|__ACCESS__|$$SEAWEED_ACCESS_KEY|; s|__SECRET__|$$SEAWEED_SECRET_KEY|\" /etc/seaweedfs/s3.json.template > /etc/seaweedfs/s3.json && exec weed \"$$@\"", "--"]
    environment:
      SEAWEED_ACCESS_KEY: ${SEAWEED_ACCESS_KEY:?}
      SEAWEED_SECRET_KEY: ${SEAWEED_SECRET_KEY:?}
    networks: [internal]
    healthcheck:
      # Healthy once the master, the filer and the S3 gateway all answer: the bucket is created through the filer.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:8888/ >/dev/null && wget -qO- http://127.0.0.1:8333/ 2>&1 | grep -qv 'Connection refused'"]
      interval: 5s
      timeout: 3s
      retries: 30

  objects-init:
    image: chrislusf/seaweedfs:3.80
    restart: "no"
    # Creates the bucket through SeaweedFS's own shell; idempotent (an existing bucket is left alone).
    entrypoint: ["/bin/sh", "-c", "for i in $$(seq 1 30); do echo \"s3.bucket.create -name $$BUCKET\" | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 >/dev/null 2>&1; echo s3.bucket.list | weed shell -master=seaweedfs:9333 -filer=seaweedfs:8888 2>/dev/null | grep -q \"$$BUCKET\" && exit 0; sleep 2; done; exit 1"]
    environment:
      BUCKET: ${PIM_S3_BUCKET:-pim-objects}
    networks: [internal]
    depends_on:
      seaweedfs: { condition: service_healthy }

  migrator:
    <<: *pim
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *pim-env
      # No PIM_ROLE: the migrator is the one-shot SQL runner (foundation 0001, then each workstream's band), not a process role of @pim/v2-contracts.
      # The migrator owns the schema, so it connects to PostgreSQL directly (advisory locks and DDL do not belong in transaction pooling).
      PIM_DATABASE_URL: postgres://pim_migrator:${PIM_MIGRATOR_DB_PASSWORD:?}@postgres:5432/pim
    depends_on:
      postgres: { condition: service_healthy }

  gate:
    <<: *pim
    command: ["gate"]
    environment: { <<: *pim-env, PIM_ROLE: gate, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_gate_login:${PIM_GATE_DB_PASSWORD:?}@pgbouncer:6432/pim" }
    depends_on: *pim-deps
    healthcheck: &http-health
      # The image is node:*-slim, which has no wget or curl.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  # The web app, on its own (deploy/Dockerfile.web, web-host/): it serves the interface and nothing else, and has no database, secret or backend dependency, so it starts, restarts and is
  # replaced without any role noticing, and the other way round. Caddy sends it every path the backend does not own. On starting it publishes the build its image carries into the
  # pim-web volume and keeps the files of earlier releases there for pages still open on them (docs/v2-operations.md, "The web app is its own component").
  web:
    image: ${PIM_WEB_IMAGE:-ghcr.io/ajac-zero/pim-web:stable}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
    environment: { PIM_HTTP_PORT: "8080", PIM_WEB_KEEP: "${PIM_WEB_KEEP:-5}", PIM_WEB_KEEP_DAYS: "${PIM_WEB_KEEP_DAYS:-7}" }
    volumes: [pim-web:/web-releases]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  live:
    <<: *pim
    command: ["live"]
    environment: { <<: *pim-env, PIM_ROLE: live, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_live_login:${PIM_LIVE_DB_PASSWORD:?}@pgbouncer:6432/pim" }
    depends_on: *pim-deps
    healthcheck: *http-health

  runner:
    <<: *pim
    command: ["runner"]
    # Scale with --scale runner=N. A stop gives a Runner time to hand its partition leases back before it is killed.
    stop_grace_period: 120s
    environment: { <<: *pim-env, PIM_ROLE: runner, PIM_HTTP_PORT: "8080", PIM_DRAIN_WINDOW_SECONDS: "90", PIM_DATABASE_URL: "postgres://pim_runtime_login:${PIM_RUNTIME_DB_PASSWORD:?}@pgbouncer:6432/pim", PIM_APP_DATABASE_URL: "postgres://pim_gate_login:${PIM_GATE_DB_PASSWORD:?}@pgbouncer:6432/pim", PIM_FORGE_DATABASE_URL: "postgres://pim_forge_login:${PIM_FORGE_DB_PASSWORD:?}@pgbouncer:6432/pim" }
    depends_on: *pim-deps
    healthcheck: *http-health
    deploy:
      replicas: 1

  forge:
    <<: *pim
    command: ["forge"]
    environment: { <<: *pim-env, PIM_ROLE: forge, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_forge_login:${PIM_FORGE_DB_PASSWORD:?}@pgbouncer:6432/pim" }
    depends_on: *pim-deps
    healthcheck: *http-health

  maintenance:
    <<: *pim
    command: ["maintenance"]
    # Retention, vacuum helpers, lease sweeps and export jobs; one instance, connecting to PostgreSQL directly for long statements.
    environment: { <<: *pim-env, PIM_ROLE: maintenance, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_maintenance_login:${PIM_MAINTENANCE_DB_PASSWORD:?}@postgres:5432/pim" }
    depends_on: *pim-deps
    healthcheck: *http-health

  canvas:
    <<: *pim
    profiles: [canvas]
    command: ["canvas"]
    environment: { <<: *pim-env, PIM_ROLE: canvas, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_gate_login:${PIM_GATE_DB_PASSWORD:?}@pgbouncer:6432/pim" }
    depends_on: *pim-deps
    healthcheck: *http-health

  relay:
    <<: *pim
    profiles: [computer]
    command: ["relay"]
    environment: { <<: *pim-env, PIM_ROLE: relay, PIM_HTTP_PORT: "8080", PIM_DATABASE_URL: "postgres://pim_gate_login:${PIM_GATE_DB_PASSWORD:?}@pgbouncer:6432/pim", PIM_TURN_URL: "turn:${PIM_DOMAIN}:3478" }
    depends_on: *pim-deps
    healthcheck: *http-health

  coturn:
    image: coturn/coturn:4.6.2-alpine
    profiles: [computer]
    restart: unless-stopped
    network_mode: host
    command: ["-n", "--realm=${PIM_DOMAIN}", "--use-auth-secret", "--static-auth-secret=${TURN_SHARED_SECRET:?}", "--no-cli", "--fingerprint", "--no-tcp-relay", "--min-port=49160", "--max-port=49200"]

  # A personal computer on the same machine as the stack. It is NOT one of the Pim roles: it gets no env_file, so no database, NATS, object-store or key credential, and it joins none of
  # the stack's networks. It connects out to the stack's public address with the `pimc_` token a person paired in Settings → Computer, exactly as a computer elsewhere would.
  # What agents run on it (after a person approves each command) runs inside this container as the unprivileged `node` user, with only the `pim-files` volume to write to.
  # A container is not a security sandbox for arbitrary code: do not mount the Docker socket or host paths here you would not give an agent.
  pim-computer:
    # Its own image (deploy/Dockerfile.computer): Node, computer/ and a headless Chromium, with none of the server. It is pulled from the published image; `up --build` makes it from
    # this checkout instead (set PIM_COMPUTER_IMAGE=pim-computer:local to keep it). `pim.sh update` sets PIM_COMPUTER_IMAGE to the digest it pulled.
    build: { context: ../.., dockerfile: deploy/Dockerfile.computer }
    image: ${PIM_COMPUTER_IMAGE:-ghcr.io/ajac-zero/pim-computer:stable}
    profiles: [local-computer]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: node
    working_dir: /workspace
    environment:
      # The stack's public address as this host reaches it, such as https://pim.example.com, or http://host.docker.internal:8088 for the plain-HTTP trial stack.
      PIM_URL: ${PIM_COMPUTER_URL:-}
      PIM_COMPUTER_TOKEN: ${PIM_COMPUTER_TOKEN:-}
      PIM_COMPUTER_ROOT: /workspace
      HOME: /home/node
    # pim-computer-home keeps the browser's profile (what a person signed in to there) and the computer's own state across restarts.
    volumes: [pim-files:/workspace, pim-computer-home:/home/node]
    networks: [computer]
    # The host's own address, so the localhost trial stack is reachable from inside the container; set PIM_COMPUTER_HOST_ALIAS to the public hostname
    # when the host cannot reach its own public address (no hairpin NAT).
    extra_hosts: ["host.docker.internal:host-gateway", "${PIM_COMPUTER_HOST_ALIAS:-pim.invalid}:host-gateway"]

  # The coding profile: a sandbox manager that gives each coding workspace (and each harness sign-in) one gVisor container, behind an egress proxy that lets a workspace reach only the
  # hosts it is allowed, and a socket proxy that is the only service holding the Docker socket. The host needs Docker with gVisor registered as the `runsc` runtime; the manager refuses to start without it.
  # Set PIM_CODING_MANAGER_URL=http://sandbox-manager:8080 in .env so the forge and gate roles use it. A workspace reaches Pim (its git broker) only through the egress proxy, which tunnels HTTPS to
  # public hostnames, so PIM_PUBLIC_URL must be an https URL the proxy can reach (not http://localhost).
  workspace-image:
    build: { context: ../../workspace-agentd }
    image: pim-workspace:local
    profiles: [coding]
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: [coding]
    restart: unless-stopped
    # Only the API groups the manager needs; EXEC stays off, because commands run through workspace-agentd.
    environment: { CONTAINERS: "1", VOLUMES: "1", NETWORKS: "1", IMAGES: "1", INFO: "1", SYSTEM: "1", POST: "1" }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [control]

  egress-proxy:
    build: { context: ../../sandbox-manager, target: egress-proxy }
    image: pim-egress-proxy:local
    container_name: egress-proxy # the manager connects it to every workspace network by this name
    profiles: [coding]
    restart: unless-stopped
    # EGRESS_INTERNAL_HOSTS: host:port pairs of the stack's own front door that a workspace may reach over plain HTTP, for a machine with no public HTTPS address (PIM_CODING_BROKER_URL names the same one).
    environment: { PROXY_ADMIN_TOKEN: "${PROXY_ADMIN_TOKEN:?}", EGRESS_INTERNAL_HOSTS: "${PIM_CODING_INTERNAL_HOSTS:-}" }
    networks: [control, outbound, internal]

  sandbox-manager:
    build: { context: ../../sandbox-manager, target: manager }
    image: pim-sandbox-manager:local
    container_name: sandbox-manager # it attaches itself to each workspace network by this name
    restart: unless-stopped
    profiles: [coding]
    depends_on:
      docker-socket-proxy: { condition: service_started }
      egress-proxy: { condition: service_started }
      workspace-image: { condition: service_completed_successfully }
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MANAGER_TOKEN: "${PIM_CODING_MANAGER_TOKEN:?}"
      PROXY_ADMIN_TOKEN: "${PROXY_ADMIN_TOKEN:?}"
      ALLOWED_IMAGES: "${PIM_ALLOWED_SANDBOX_IMAGES:-pim-workspace:local}"
      MANAGER_CONTAINER: sandbox-manager
      EGRESS_PROXY_CONTAINER: egress-proxy
      DOCKER_ROOT: /docker-root
      DATA_DIR: /data
    # statfs() runs inside this container, so it needs a directory on the same filesystem as Docker's data root.
    volumes: ["${DOCKER_ROOT_HOST:-/var/lib/pim-sandbox}:/docker-root:ro", "manager-data:/data"]
    networks: [control, internal]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: unless-stopped
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/pim-alerts.rules.yml:/etc/prometheus/pim-alerts.rules.yml:ro
      - prometheus-data:/prometheus
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]
    ports: ["127.0.0.1:3000:3000"]

networks:
  edge: {}
  # `internal` carries service-to-service traffic; only caddy is on `edge` and publishes ports. Coding workspaces live on networks the sandbox manager makes, apart from these: nothing there can reach PostgreSQL, NATS or object storage.
  internal: {}
  # `control` carries the manager's calls to the socket proxy and the egress proxy's admin port: no route out. `outbound` is the egress proxy's way to the internet.
  control: { internal: true }
  outbound: {}
  # pim-computer's own: it reaches the host (and so the stack's published ports) and the internet, and nothing inside the stack.
  computer: {}

volumes:
  # Releases of the web app (web-host/src/release.js): the web container publishes into it as it starts and keeps the earlier ones for open pages.
  pim-web: {}
  pim-files: {}
  pim-computer-home: {}
  postgres-data: {}
  seaweedfs-data: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  grafana-data: {}
  manager-data: {}
