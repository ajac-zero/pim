# NATS Core: fire-and-forget fanout of commit events from Runners to Live. Nothing here is a source of truth: a missed message is recovered from PostgreSQL by cursor.
port: 4222
http: 8222
server_name: pim-nats
# A computer answers a 512 KiB file read as about 700 KB of base64 text; 8 MB leaves room for a larger call and stays within the limit NATS advises.
max_payload: 8388608
max_connections: 2000
write_deadline: "5s"
# No JetStream: Pim does not need durable streams in NATS.
