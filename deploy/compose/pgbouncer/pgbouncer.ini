; Transaction-mode pooling with a bounded pool per role. A role's pool is a database entry with its own pool_size, so one role cannot take the others' connections.
; Session state (advisory locks, LISTEN, SET) does not survive between transactions: roles that need it (the migrator, maintenance) connect to PostgreSQL directly.
[databases]
pim = host=postgres port=5432 dbname=pim

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_user = pgbouncer_auth
auth_query = SELECT usename, passwd FROM pgbouncer.get_auth($1)
; The auth user's own password comes from a file the container's entrypoint writes from PGBOUNCER_AUTH_PASSWORD at start (never committed).
auth_file = /tmp/userlist.txt
pool_mode = transaction
; Pools are per (database, user): each role gets up to default_pool_size server connections, and the per-role caps below.
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 2000
max_db_connections = 160
max_user_connections = 80
server_idle_timeout = 300
query_wait_timeout = 15
client_idle_timeout = 0
; A client that is waiting longer than this for a connection is failed rather than queued without bound.
server_reset_query = DISCARD ALL
; node-postgres sends named prepared statements; PgBouncer 1.21+ tracks them per server connection in transaction mode.
max_prepared_statements = 200
; node-postgres sends each pool's statement_timeout at startup, which PgBouncer cannot pass through; every login carries its own
; statement_timeout (ALTER ROLE in postgres/init/00-roles.sh), which applies on the server connection instead.
ignore_startup_parameters = extra_float_digits,options,statement_timeout
admin_users = pgbouncer_auth
stats_users = pgbouncer_auth
log_connections = 0
log_disconnections = 0
