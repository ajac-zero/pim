# PostgreSQL 17 for Pim. Durability is not tunable here: these three stay on.
fsync = on
full_page_writes = on
synchronous_commit = on

listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 1536MB
wal_level = replica
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
wal_compression = on
track_io_timing = on
track_wal_io_timing = on
log_min_duration_statement = 500ms
log_line_prefix = '%m [%p] %q%u@%d '
password_encryption = scram-sha-256
# Archive WAL to an object store for point-in-time recovery: set archive_mode = on and archive_command in a deployment-specific include.
include_if_exists = '/etc/postgresql/archive.conf'
