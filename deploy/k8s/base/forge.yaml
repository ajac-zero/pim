# Git forge and app build integration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-forge
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge, pim.dev/tier: control }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge, pim.dev/tier: control }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
    spec:
      serviceAccountName: pim
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge }
      containers:
        - name: forge
          image: registry.example.test/pim:2.0.0
          args: ["forge"]
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: pim-config }
          env:
            - { name: PIM_ROLE, value: forge }
            - { name: PIM_HTTP_PORT, value: "8080" }
            - { name: PIM_DATABASE_URL, valueFrom: { secretKeyRef: { name: pim-db, key: runtime-url } } }
            - { name: PIM_OBJECTS_ENDPOINT, valueFrom: { secretKeyRef: { name: pim-objects, key: endpoint } } }
            - { name: PIM_OBJECTS_BUCKET, valueFrom: { secretKeyRef: { name: pim-objects, key: bucket } } }
            - { name: PIM_OBJECTS_ACCESS_KEY, valueFrom: { secretKeyRef: { name: pim-objects, key: access-key } } }
            - { name: PIM_OBJECTS_SECRET_KEY, valueFrom: { secretKeyRef: { name: pim-objects, key: secret-key } } }
            - { name: PIM_INGRESS_SECRET, valueFrom: { secretKeyRef: { name: pim-ingress, key: secret } } }
            # Envelope keys are mounted as files, one per key id, and read from here: they are never environment variables and never in a ConfigMap.
            - { name: PIM_KEK_DIR, value: /run/secrets/pim-kek }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "500m", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 3, failureThreshold: 40 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          volumeMounts:
            - { name: kek, mountPath: /run/secrets/pim-kek, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: kek
          secret: { secretName: pim-kek, defaultMode: 0400 }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pim-forge
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge }
spec:
  selector: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pim-forge
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: forge }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pim-forge
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pim-forge }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Pods, value: 1, periodSeconds: 60 }] }
