# The versioned SQL runner, once per release (run it before rolling the workloads): `kubectl apply -f` this Job, or let your CD tool run it as a pre-sync hook.
apiVersion: batch/v1
kind: Job
metadata:
  name: pim-migrate
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: migrator, pim.dev/tier: control }
  annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: migrator, pim.dev/tier: control }
    spec:
      restartPolicy: Never
      serviceAccountName: pim
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example.test/pim:2.0.0
          args: ["migrate"]
          env:
            - { name: PIM_ROLE, value: migrator }
            - { name: PIM_DATABASE_URL, valueFrom: { secretKeyRef: { name: pim-db, key: migrator-url } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
