# NATS Core cluster: fanout of commit events between Runners and Live. No JetStream and no source of truth: a lost message is recovered from PostgreSQL by cursor.
apiVersion: v1
kind: ConfigMap
metadata: { name: pim-nats }
data:
  nats.conf: |
    port: 4222
    http: 8222
    server_name: $POD_NAME
    max_payload: 1048576
    write_deadline: "5s"
    cluster {
      name: pim
      port: 6222
      routes: [
        nats://pim-nats-0.pim-nats-headless:6222
        nats://pim-nats-1.pim-nats-headless:6222
        nats://pim-nats-2.pim-nats-headless:6222
      ]
    }
---
apiVersion: v1
kind: Service
metadata: { name: pim-nats-headless }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: pim-nats }
  ports: [{ name: cluster, port: 6222 }, { name: client, port: 4222 }]
---
apiVersion: v1
kind: Service
metadata: { name: pim-nats }
spec:
  selector: { app.kubernetes.io/name: pim-nats }
  ports: [{ name: client, port: 4222 }, { name: monitor, port: 8222 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pim-nats
  labels: { app.kubernetes.io/name: pim-nats, pim.dev/tier: control }
spec:
  serviceName: pim-nats-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector: { matchLabels: { app.kubernetes.io/name: pim-nats } }
  template:
    metadata: { labels: { app.kubernetes.io/name: pim-nats, pim.dev/tier: control } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm: { topologyKey: kubernetes.io/hostname, labelSelector: { matchLabels: { app.kubernetes.io/name: pim-nats } } }
      containers:
        - name: nats
          image: nats:2.10.22-alpine
          args: ["-c", "/etc/nats/nats.conf"]
          env: [{ name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }]
          ports: [{ name: client, containerPort: 4222 }, { name: cluster, containerPort: 6222 }, { name: monitor, containerPort: 8222 }]
          readinessProbe: { httpGet: { path: /healthz, port: monitor }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: monitor }, periodSeconds: 10, failureThreshold: 6 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/nats, readOnly: true }]
      volumes: [{ name: config, configMap: { name: pim-nats } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: pim-nats }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: pim-nats } }
