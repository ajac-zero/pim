# NOT part of the kustomization. Shapes of the Secrets the workloads read, for a cluster that has no secret manager.
# With OpenBao (or Vault) and External Secrets Operator, use overlays/openbao instead, which creates these from the manager.
#
# pim-kek        one file per key-encryption key id; the file name is the id and the content is 32 random bytes, base64.
#                Rotation: add k2, set PIM_KEK_CURRENT=k2 in pim-config, roll the workloads, run the rewrap job, then remove k1.
# pim-db         one URL per login, each a member of its @pim/v2-contracts role (pim_gate, pim_runtime, pim_live, pim_forge, pim_maintenance):
#                gate-url, live-url, runtime-url, forge-url: postgres://pim_<kind>_login:...@pim-pg-pooler-rw:5432/pim   (through the PgBouncer Pooler, transaction mode)
#                maintenance-url: postgres://pim_maintenance_login:...@pim-pg-rw:5432/pim                              (direct, for long statements)
#                migrator-url: postgres://pim_migrator:...@pim-pg-rw:5432/pim                                         (direct; used only by the migration Job)
apiVersion: v1
kind: Secret
metadata: { name: pim-kek }
type: Opaque
stringData:
  k1: CHANGE_ME_BASE64_32_BYTES
---
apiVersion: v1
kind: Secret
metadata: { name: pim-db }
type: Opaque
stringData:
  gate-url: CHANGE_ME
  live-url: CHANGE_ME
  runtime-url: CHANGE_ME
  forge-url: CHANGE_ME
  maintenance-url: CHANGE_ME
  migrator-url: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata: { name: pim-objects }
type: Opaque
stringData: { endpoint: CHANGE_ME, bucket: pim-objects, access-key: CHANGE_ME, secret-key: CHANGE_ME }
---
apiVersion: v1
kind: Secret
metadata: { name: pim-ingress }
type: Opaque
stringData: { secret: CHANGE_ME_AT_LEAST_32_CHARACTERS_RANDOM }
---
apiVersion: v1
kind: Secret
metadata: { name: pim-pg-roles }
type: kubernetes.io/basic-auth
stringData: { username: pim_migrator, password: CHANGE_ME }
