# The web app, on its own: serves the interface and nothing else (web-host/, deploy/Dockerfile.web), with no database, secret or service account. Setting its image tag releases the
# interface; no backend role rolls. Each pod publishes the build its image carries into the shared releases volume as it starts and keeps the earlier releases there, so pages still
# open on the one before keep the scripts they ask for. The volume must be ReadWriteMany (every replica reads and publishes into it): set `storageClassName` below to a class that is.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pim-web-releases
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web }
spec:
  accessModes: [ReadWriteMany]
  # storageClassName: <a ReadWriteMany class of your cluster>
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pim-web
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web, pim.dev/tier: edge }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web, pim.dev/tier: edge }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: registry.example.test/pim-web:2.0.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PIM_HTTP_PORT, value: "8080" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 6 }
          volumeMounts:
            - { name: releases, mountPath: /web-releases }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: releases
          persistentVolumeClaim: { claimName: pim-web-releases }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: pim-web
  labels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web }
spec:
  selector: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pim-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pim, app.kubernetes.io/component: web }
