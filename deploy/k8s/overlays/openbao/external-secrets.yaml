apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: openbao, namespace: pim }
spec:
  provider:
    vault:
      server: https://openbao.example.test:8200
      path: pim
      version: v2
      auth:
        kubernetes: { mountPath: kubernetes, role: pim, serviceAccountRef: { name: pim } }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: pim-kek, namespace: pim }
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: pim-kek, creationPolicy: Owner }
  # One key per envelope key id (k1, k2, ...): the map is read whole, so adding a key in OpenBao adds a file to every pod's mount.
  dataFrom: [{ extract: { key: pim/kek } }]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: pim-db, namespace: pim }
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: pim-db, creationPolicy: Owner }
  dataFrom: [{ extract: { key: pim/db } }]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: pim-objects, namespace: pim }
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: pim-objects, creationPolicy: Owner }
  dataFrom: [{ extract: { key: pim/objects } }]
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: pim-ingress, namespace: pim }
spec:
  refreshInterval: 5m
  secretStoreRef: { name: openbao, kind: SecretStore }
  target: { name: pim-ingress, creationPolicy: Owner }
  dataFrom: [{ extract: { key: pim/ingress } }]
