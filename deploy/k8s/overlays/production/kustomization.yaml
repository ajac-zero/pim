# A starting point for production: the OpenBao secrets, the sandbox zone, and a pinned image digest. Copy it, set the image and hostnames, and apply.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../openbao
  - ../../sandboxes
images:
  - name: registry.example.test/pim
    newTag: 2.0.0
