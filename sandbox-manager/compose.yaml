# sandbox-manager + docker-socket-proxy + egress-proxy, and the default workspace image.
# The Docker socket is mounted ONLY into docker-socket-proxy, which allows just the API
# groups the manager needs. Session containers and networks are created by the manager at
# runtime; the egress-proxy and the manager are attached to each session's internal network.
# The host must already have Docker with gVisor registered as the `runsc` runtime.
#
#   MANAGER_TOKEN=... PROXY_ADMIN_TOKEN=... AGENTD_TOKEN_SECRET=... docker compose up -d --build

services:
  # Builds workspace-agentd's image, the default sandbox image, then exits.
  workspace-image:
    build: ../workspace-agentd
    image: pim-workspace:local
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1 # create, start, inspect, remove, list, wait
      VOLUMES: 1
      NETWORKS: 1 # create, remove, connect/disconnect the egress-proxy and the manager
      IMAGES: 1 # inspect and pull
      INFO: 1 # the runsc check reads /info
      SYSTEM: 1 # GET /system/df, which measures the dependency cache volumes
      POST: 1 # the default is read-only
      # Everything else stays at the image default of 0, including EXEC: commands run through
      # workspace-agentd, not Docker exec. Also BUILD, SWARM, SECRETS, PLUGINS, SERVICES, TASKS,
      # NODES, CONFIGS, AUTH, COMMIT, DISTRIBUTION, EVENTS...
    volumes:
      # DOCKER_SOCKET is the daemon's socket path on the host (rootless or non-default installs).
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [control]

  sandbox-manager:
    build:
      context: .
      target: manager
      args:
        BUILD_SHA: ${BUILD_SHA:?run ./up.sh, which sets BUILD_SHA}
    image: pim-sandbox-manager
    container_name: sandbox-manager # it attaches itself to session networks by this name
    restart: unless-stopped
    depends_on:
      docker-socket-proxy: { condition: service_started }
      egress-proxy: { condition: service_started }
      workspace-image: { condition: service_completed_successfully }
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      MANAGER_TOKEN: ${MANAGER_TOKEN:?set MANAGER_TOKEN}
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?set PROXY_ADMIN_TOKEN}
      AGENTD_TOKEN_SECRET: ${AGENTD_TOKEN_SECRET:-}
      ALLOWED_IMAGES: ${ALLOWED_IMAGES:-pim-workspace:local}
      PROBE_IMAGE: ${PROBE_IMAGE:-busybox:1.36}
      MANAGER_CONTAINER: sandbox-manager
      EGRESS_PROXY_CONTAINER: egress-proxy
      EGRESS_PROXY_URL: http://egress-proxy:3128
      EGRESS_PROXY_ADMIN_URL: http://egress-proxy:3129
      MIN_FREE_DISK_PCT: ${MIN_FREE_DISK_PCT:-15}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-}
      IDLE_MIN: ${IDLE_MIN:-30}
      DEFAULT_DISK_MIB: ${DEFAULT_DISK_MIB:-5120}
      MAX_TOTAL_WORKSPACE_GB: ${MAX_TOTAL_WORKSPACE_GB:-100}
      DISK_QUOTA_MODE: ${DISK_QUOTA_MODE:-auto}
      DISK_CHECK_SEC: ${DISK_CHECK_SEC:-60}
      KEPT_VOLUME_DAYS: ${KEPT_VOLUME_DAYS:-7}
      # statfs() runs inside this container, so it needs a directory on the SAME filesystem as
      # Docker's data-root (not data-root itself: that would expose every layer). With a
      # dedicated data disk for Docker, set DOCKER_ROOT_HOST to a directory on that disk.
      DOCKER_ROOT: /docker-root
      WORKSPACE_TMPFS: ${WORKSPACE_TMPFS:-0}
      DATA_DIR: /data
      SNAPSHOT_MAX_GB: ${SNAPSHOT_MAX_GB:-4}
      SNAPSHOT_CACHE_PCT: ${SNAPSHOT_CACHE_PCT:-20}
    volumes:
      - ${DOCKER_ROOT_HOST:-/var/lib/pim-sandbox}:/docker-root:ro
      # Workspace snapshots, on Docker's data-root like the workspaces they count against.
      - manager-data:/data
    ports:
      - "127.0.0.1:${MANAGER_PORT:-8080}:8080"
    networks: [control, api]

  egress-proxy:
    # An image of its own, tagged by a hash of what goes into it (up.sh sets EGRESS_PROXY_TAG), so
    # a deploy that does not change the proxy leaves its image, and so its container, as they are.
    # Recreating it would cut every session's open connections and drop its allowlists until the
    # manager registers them again.
    build:
      context: .
      target: egress-proxy
    image: pim-egress-proxy:${EGRESS_PROXY_TAG:-local}
    container_name: egress-proxy # the manager connects it to every session network by this name
    restart: unless-stopped
    environment:
      PROXY_ADMIN_TOKEN: ${PROXY_ADMIN_TOKEN:?set PROXY_ADMIN_TOKEN}
    networks: [control, outbound]

volumes:
  manager-data: {}

networks:
  api: {} # only so the manager's port can be published on localhost; replace with your Pim network
  control:
    internal: true # manager <-> socket proxy <-> proxy admin; no route out
  outbound: {} # the only network with a route to the internet
