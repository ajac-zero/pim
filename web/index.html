<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Pim, your personal agent." />
    <title>Pim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the theme before first paint, so dark mode doesn't flash.
      (function () {
        try {
          var t = localStorage.getItem("pim-theme");
          var d =
            t === "dark" ||
            ((!t || t === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
